name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green suite only proves the code worked on the day it ran. D4 shipped tests that passed on
  # merge and failed four days later, because the trigger was the calendar rather than a commit —
  # so main went red with nothing to notice it. This catches that class of drift, along with
  # anything a dependency release breaks under us.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      # Catches a test that asserts on the real current date, on the PR that introduces it
      # rather than when the year turns over. It does not catch mtime-versus-hardcoded-date
      # drift, which is what the nightly run is for. See tests/conftest.py.
      - name: Test against a future clock
        run: CRATE_TEST_CLOCK=2027-03-01 uv run pytest -q

      # The command has to work when installed, not just under `uv run` —
      # that is the actual contract with a user.
      - name: Verify the installed command
        run: |
          uv tool install .
          "$HOME/.local/bin/crate" --version

          # --version can't see missing package data. The templates have to be in
          # the wheel, and scaffolding a vault is the first thing that reads them —
          # so this is the step that catches "works from a checkout, broken installed".
          "$HOME/.local/bin/crate" init /tmp/ci-vault --scope personal
          test -f /tmp/ci-vault/CLAUDE.md
          test -f /tmp/ci-vault/.crate/templates/concept.md

  # Secret scanning, kept a separate job so it's its own required check and so a contributor who
  # skips the local pre-commit hook (.pre-commit-config.yaml) is still caught here. Same gitleaks
  # the hook runs, pinned to the same version — but over the whole history rather than staged
  # changes, which is what matters for a repo whose history is exposed retroactively on going public.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks walks commit history, so it needs all of it — the default shallow checkout
          # would leave everything but the tip commit unscanned.
          fetch-depth: 0

      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose
