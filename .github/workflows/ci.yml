name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      # The command has to work when installed, not just under `uv run` —
      # that is the actual contract with a user.
      - name: Verify the installed command
        run: |
          uv tool install .
          "$HOME/.local/bin/crate" --version

          # --version can't see missing package data. The templates have to be in
          # the wheel, and scaffolding a vault is the first thing that reads them —
          # so this is the step that catches "works from a checkout, broken installed".
          "$HOME/.local/bin/crate" init /tmp/ci-vault --scope personal
          test -f /tmp/ci-vault/CLAUDE.md
          test -f /tmp/ci-vault/.crate/templates/concept.md
