[project]
name = "crate-wiki"
version = "0.1.0"
description = "An LLM wiki that compounds what you learn and what you've done."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Peter Tos" }]
keywords = ["llm", "wiki", "knowledge-management", "claude-code", "obsidian"]
dependencies = ["typer>=0.12"]

[project.urls]
Homepage = "https://github.com/bmxcode/crate-wiki"
Issues = "https://github.com/bmxcode/crate-wiki/issues"

# The distribution is `crate-wiki` (PyPI's `crate` belongs to the CrateDB client),
# but the command you type stays `crate`.
[project.scripts]
crate = "crate_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate_wiki"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
